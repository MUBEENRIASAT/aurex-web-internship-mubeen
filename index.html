<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager | AUREX Week 4</title>

    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Task Manager</h1>
            <p>AUREX Web Development Internship — Week 4</p>
        </div>
    </header>

    <main class="container">

        <!-- Add Task Section -->
        <section class="task-form-section">

            <h2 id="form-title">Add New Task</h2>

            <form id="task-form">

                <div class="form-group">
                    <label for="task-input">Task</label>

                    <input
                        type="text"
                        id="task-input"
                        placeholder="Enter your task..."
                        autocomplete="off"
                    >

                    <small id="error-message"></small>
                </div>

                <button type="submit" id="submit-button">
                    Add Task
                </button>

                <button
                    type="button"
                    id="cancel-button"
                    class="cancel-btn hidden"
                >
                    Cancel
                </button>

            </form>

        </section>


        <!-- Task Controls -->
        <section class="task-controls">

            <h2>My Tasks</h2>

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="pending"
                >
                    Pending
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- Task List -->
        <section class="task-list-section">

            <div id="task-list"></div>

            <p id="empty-message" class="empty-message">
                No tasks available.
            </p>

        </section>

    </main>


    <footer class="footer">
        <p>AUREX Full-Stack Engineering Internship — Week 4</p>
    </footer>


    <script src="scripts/main.js"></script>

</body>
</html>
